name: Publish MSIX to Microsoft Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.5.0), without the leading v'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION=${TAG#v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version $VERSION"

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: Install MSStore CLI
        uses: microsoft/microsoft-store-apppublisher@271384ce0e6e03162184c55b05392e8f4044aa78 # v1.2

      - name: Configure MSStore CLI credentials
        run: >
          msstore reconfigure
          --tenantId ${{ secrets.AZURE_TENANT_ID }}
          --sellerId ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          --clientId ${{ secrets.AZURE_CLIENT_ID }}
          --clientSecret ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Check for pending submission
        run: |
          $output = msstore submission status ${{ vars.STORE_APP_ID }} 2>&1 | Out-String
          $clean = $output -replace '\x1b\[[\d;]*[mGKHF]', ''
          if ($clean -match 'Submission Status\s*=\s*(\S+)') {
            $status = $Matches[1].Trim()
            $blocking = @('PendingCommit','CommitStarted','PendingPublication','Publishing','PreProcessing','Certification','Release')
            if ($blocking -contains $status) {
              Write-Error "A submission is already in progress (status: $status). Wait for it to complete or cancel it in Partner Center before pushing again."
              exit 1
            }
          }

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Set version in csproj
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $csproj  = "DiffThis/DiffThis.csproj"
          $xml     = [xml](Get-Content $csproj)
          $xml.SelectSingleNode("//ApplicationDisplayVersion").InnerText = $version
          $xml.Save((Resolve-Path $csproj))

      - name: Publish Windows MSIX (Store upload)
        run: >
          dotnet publish DiffThis/DiffThis.csproj
          -f net10.0-windows10.0.19041.0
          -c Release

      - name: Submit to Microsoft Store
        run: msstore publish DiffThis --appId ${{ vars.STORE_APP_ID }}
